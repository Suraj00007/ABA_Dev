name: Deploy to  Salesforce
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Salesforce CLI
        run: |
          npm install sfdx-cli --global

      - name: Authenticate with Salesforce
      run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > sf org login sfdx-url.txt --alias ABA_Dev --set-default --sfdx-url-stdin

      - name: Deploy to Salesforce
        run: |
          sf prject deploy start --target-org ABA_Dev --wait 10
